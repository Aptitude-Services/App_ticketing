{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Nouveau rapport" %}{% endblock %}
{% block content %}
<div class="page-head"><div>
  <a class="crumb" href="{% url 'report' kind %}">← {{ kind_label }}</a>
  <h1>{% translate "Nouveau rapport" %} — {{ kind_label|lower }}</h1>
</div></div>
<section class="panel"><div class="panel-body">
  <form method="post" class="stack">{% csrf_token %}
    {% include "_form_fields.html" %}
    <div class="form-actions"><button class="btn btn-primary" type="submit">{% translate "Créer le brouillon" %}</button></div>
  </form>
</div></section>
{% endblock %}
