{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Changer de mot de passe" %}{% endblock %}
{% block content %}
<p class="crumb"><a href="{% url 'my_profile' %}">{% translate "Mon profil" %}</a></p>
<div class="page-head"><div><h1>{% translate "Changer de mot de passe" %}</h1></div></div>
<form method="post" class="panel" style="max-width:560px">{% csrf_token %}
  <div class="form-section">{% include "_form_fields.html" %}</div>
  <div class="form-actions"><button class="btn btn-primary" type="submit">{% translate "Enregistrer le mot de passe" %}</button><a class="btn btn-secondary" href="{% url 'my_profile' %}">{% translate "Annuler" %}</a></div>
</form>
{% endblock %}
