# Aptitude Support — déploiement sur VPS
# Usage : cp .env.example .env (puis éditer) && docker compose up -d --build
services:
  proxy:
    # v3.6 minimum : les versions antérieures échouent avec Docker 29 (« client version 1.24 is too old »).
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Certificat fourni par fichier (autorité interne Aptitude) : voir docker/traefik/tls.yml
      # et docker/certs/creer-certificat.sh. Let's Encrypt : docker-compose.letsencrypt.yml.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    # Apache occupe déjà le port 80 sur srv-aptitude-4 : site servi en HTTPS sur 8843.
    ports:
      - "8843:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - ./docker/traefik:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro

  web:
    build:
      context: .
      args:
        # Par défaut, pas de LibreOffice : le COMEX se télécharge en PowerPoint (PDF via
        # PowerPoint, Enregistrer sous). INSTALL_LIBREOFFICE=1 dans .env ajoute l'export PDF
        # direct depuis le site (environ 400 Mo, paquets Debian à télécharger).
        INSTALL_LIBREOFFICE: ${INSTALL_LIBREOFFICE:-0}
    image: aptitude-support:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.services.support.loadbalancer.server.port=8000
      - traefik.http.routers.support.rule=Host(`${SITE_DOMAIN}`)
      - traefik.http.routers.support.entrypoints=websecure
      - traefik.http.routers.support.tls=true
      - traefik.http.routers.support.service=support
      # Console d'administration (/gestion) limitée aux IP Aptitude
      - traefik.http.routers.support-admin.rule=Host(`${SITE_DOMAIN}`) && PathPrefix(`/gestion`)
      - traefik.http.routers.support-admin.entrypoints=websecure
      - traefik.http.routers.support-admin.tls=true
      - traefik.http.routers.support-admin.service=support
      - traefik.http.routers.support-admin.middlewares=admin-ip
      - traefik.http.middlewares.admin-ip.ipallowlist.sourcerange=${ADMIN_ALLOWED_IPS}

  # Tâches automatiques (alertes de licence, clôture des tickets résolus) : aucun cron à configurer.
  scheduler:
    # Même image que « web », construite une seule fois.
    image: aptitude-support:latest
    pull_policy: never
    restart: unless-stopped
    command: ["python", "manage.py", "run_scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SKIP_MIGRATE: "1"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  media:
  letsencrypt:
